<!DOCTYPE html>

    <title>Pancakes</title>
</head>
<body>

    <h1>Pancakes</h1>

    <p>A simple and delicious pancake recipe.</p>

    <h2>Ingredients</h2>
    <ul>
        <li>Flour</li>
        <li>Eggs</li>
        <li>Milk</li>
        <li>Sugar</li>
    </ul>

    <h2>Steps</h2>
    <ol>
        <li>Mix all ingredients together.</li>
        <li>Heat a pan.</li>
        <li>Pour batter into the pan.</li>
        <li>Flip when bubbles form and cook until golden.</li>
    </ol>

</body>
