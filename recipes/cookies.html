<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>Cookies</title>
</head>
<body>

    <h1>Cookies</h1>

    <p>Delicious chocolate chip cookies.</p>

    <h2>Ingredients</h2>
    <ul>
        <li>Flour</li>
        <li>Sugar</li>
        <li>Butter</li>
        <li>Chocolate chips</li>
    </ul>

    <h2>Steps</h2>
    <ol>
        <li>Preheat oven to 350°F (175°C).</li>
        <li>Mix all ingredients together.</li>
        <li>Place dough on a baking sheet.</li>
        <li>Bake 10–12 minutes or until golden.</li>
    </ol>

</body>
