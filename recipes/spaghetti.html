<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spaghetti</title>
</head>
<body>

    <h1>Spaghetti</h1>

    <p>A simple spaghetti recipe.</p>

    <h2>Ingredients</h2>
    <ul>
        <li>Spaghetti noodles</li>
        <li>Tomato sauce</li>
        <li>Ground beef</li>
        <li>Onion</li>
    </ul>

    <h2>Steps</h2>
    <ol>
        <li>Cook noodles according to package instructions.</li>
        <li>Cook beef with onions in a pan.</li>
        <li>Add tomato sauce and simmer.</li>
        <li>Combine noodles with sauce and serve.</li>
    </ol>

</body>
</html>
